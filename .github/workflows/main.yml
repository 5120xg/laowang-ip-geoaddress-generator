name: Sync Upstream

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'GuooGaii/ip-geoaddress-generator'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/GuooGaii/ip-geoaddress-generator.git
          git fetch upstream

      - name: Merge upstream changes
        id: merge
        run: git merge upstream/main --ff-only
        continue-on-error: true

      - name: Push changes
        if: steps.merge.outcome == 'success'
        run: git push origin main

      - name: Report non fast-forward
        if: steps.merge.outcome != 'success'
        run: echo "::warning::fork 与上游已分叉，无法快进合并，请手动处理"
